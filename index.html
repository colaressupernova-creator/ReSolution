    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RE Solution - Ultimate Dark</title>
    
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
      :root {
        /* MODO CLARO (Padrão) */
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        --body-bg: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
        --glass-bg: rgba(255, 255, 255, 0.9);
        --sidebar-bg: rgba(255, 255, 255, 0.95);
        --card-bg: #ffffff;
        --text-dark: #1e293b;
        --text-light: #64748b;
        --border-color: rgba(255, 255, 255, 0.5);
        --table-hover: rgba(255, 255, 255, 0.5);
        --input-bg: rgba(255,255,255,0.6);
        --th-bg: rgba(99, 102, 241, 0.1);
        
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
    
      [data-theme="dark"] {
        --body-bg: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b);
        --glass-bg: rgba(30, 41, 59, 0.85);
        --sidebar-bg: rgba(15, 23, 42, 0.95);
        --card-bg: #1e293b;
        --text-dark: #f1f5f9;
        --text-light: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.1);
        --table-hover: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(0,0,0,0.3);
        --th-bg: rgba(99, 102, 241, 0.25);
      }
    
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      
      body { 
        font-family: 'Poppins', sans-serif; margin: 0; display: flex; height: 100vh; 
        color: var(--text-dark); overflow: hidden; 
        background: var(--body-bg); background-size: 400% 400%; animation: blushAnimation 15s ease infinite;
        transition: background 0.5s ease;
      }
      @keyframes blushAnimation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
      /* SIDEBAR */
      .sidebar { 
        width: 280px; background: var(--sidebar-bg);
        backdrop-filter: blur(20px); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; 
        padding: 25px; flex-shrink: 0; z-index: 100; transition: all 0.3s ease;
      }
      
      .logo { 
        font-size: 1.5rem; font-weight: 700; margin-bottom: 30px; 
        background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        display: flex; align-items: center; justify-content: space-between; 
      }
      
      .dark-toggle { cursor: pointer; color: var(--text-light); font-size: 1.2rem; transition: 0.3s; }
      .dark-toggle:hover { color: #f59e0b; transform: rotate(15deg); }
    
      .menu-btn { 
        background: transparent; border: none; color: var(--text-light); padding: 14px 18px; 
        display: flex; align-items: center; justify-content: flex-start; gap: 15px; 
        cursor: pointer; font-size: 0.95rem; font-weight: 500; border-radius: 12px; margin-bottom: 8px; width: 100%; transition: 0.3s; 
      }
      .menu-btn:hover { background: rgba(99, 102, 241, 0.1); color: #6366f1; transform: translateX(5px); }
      .menu-btn.active { background: var(--primary-gradient); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
    
      /* CONTENT */
      .main-content { flex: 1; padding: 30px; overflow-y: auto; overflow-x: hidden; }
      .page { display: none; animation: fadeIn 0.4s ease-out; padding-bottom: 100px; }
      .page.active { display: block; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      
      h2 { margin-top: 0; font-size: 1.8rem; font-weight: 700; margin-bottom: 25px; }
    
      /* CARDS GERAIS */
      .card { 
        background: var(--glass-bg); backdrop-filter: blur(16px);
        border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
        border: 1px solid var(--border-color); 
        margin-bottom: 25px; transition: all 0.3s ease;
      }
      .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    
      /* --- NOVOS CARDS DE SALDO (COM EFEITO) --- */
      .dash-card {
        position: relative; overflow: hidden; color: #fff;
        border: none !important; /* Remove borda padrão */
      }
      .dash-card label {
        font-size: 0.9rem; opacity: 0.9; font-weight: 500; letter-spacing: 0.5px;
        position: relative; z-index: 2;
      }
      .dash-card .dash-value {
        font-size: 2rem; font-weight: 700; margin-top: 5px;
        position: relative; z-index: 2;
        text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      }
      
      /* Ícone de fundo decorativo */
      .dash-bg-icon {
        position: absolute; right: -10px; bottom: -10px;
        font-size: 5rem; opacity: 0.15; transform: rotate(-15deg);
        z-index: 1; transition: 0.3s;
      }
      .dash-card:hover .dash-bg-icon { transform: rotate(0deg) scale(1.1); opacity: 0.25; }
    
      /* Cores específicas dos cards */
      .card-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
      .card-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); }
      .card-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); }
      /* ----------------------------------------- */
    
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
      
      input, select { 
        width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 12px; 
        font-size: 1rem; background: var(--input-bg); color: var(--text-dark); margin-bottom: 15px; outline: none; transition: 0.3s; 
      }
      input:focus, select:focus { background: var(--card-bg); border-color: #a855f7; }
      
      button { padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; transition: 0.3s; }
      .btn-primary { background: var(--primary-gradient); color: white; width: 100%; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
    
      /* TABELAS */
      .table-responsive { overflow-x: auto; border-radius: 12px; }
      table { width: 100%; border-collapse: collapse; min-width: 600px; }
      th { background: var(--th-bg); color: #6366f1; padding: 15px; text-align: center; }
      td { padding: 15px; border-bottom: 1px solid var(--border-color); vertical-align: middle; text-align: left; }
      
      tbody tr { transition: 0.2s; }
      tbody tr:hover { background: var(--table-hover); transform: scale(1.005); }
    
      /* BOTÕES HISTÓRICO ALINHADOS */
      .btn-group-action { display: flex; gap: 8px; justify-content: center; }
      .btn-icon { width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: none; transition: 0.2s; }
      .btn-icon:hover { transform: scale(1.1); }
      .btn-print-mini { background: #334155; color: white; }
      .btn-trash-mini { background: #ef4444; color: white; }
    
      /* RECEBER CARDS */
      .receber-card {
        background: var(--card-bg); border-left: 5px solid var(--warning);
        border-radius: 12px; padding: 15px; margin-bottom: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s;
      }
      .receber-card:hover { transform: translateX(5px); }
      .receber-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
      .receber-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
      .receber-btn { background: #dcfce7; color: #166534; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: 1px solid #bbf7d0; }
    
      /* CUPOM (SEMPRE CLARO) */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; }
      .cupom-box { 
        width: 300px; background: #fffdf0; padding: 15px; 
        font-family: 'Share Tech Mono', monospace; font-size: 12px; 
        color: #000 !important; border: 1px dashed #ccc; margin: 0 auto; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      }
      .cupom-box * { color: #000 !important; } /* Força preto no cupom */
      .cupom-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 10px; }
      .cupom-item { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dotted #ccc; padding-bottom: 5px; margin-bottom: 5px; }
      .cupom-total { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 8px 0; margin: 10px 0; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
      
      @media (max-width: 768px) {
        body { flex-direction: column; }
        .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; flex-direction: row; justify-content: space-between; padding: 10px 20px; background: var(--sidebar-bg); border-radius: 20px 20px 0 0; z-index: 9999; }
        .logo { display: none; }
        .menu-btn { flex: 1; flex-direction: column; justify-content: center; font-size: 0.75rem; padding: 0; gap: 5px; }
        .main-content { padding: 15px; padding-bottom: 100px; }
        .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 15px; }
      }
    </style>
    </head>
    <body>
    
      <nav class="sidebar">
        <div class="logo">
          <span>RE Solution</span>
          <i class="fas fa-moon dark-toggle" id="themeBtn" onclick="toggleTheme()"></i>
        </div>
        <button class="menu-btn active" onclick="navegar('dashboard', this)"><i class="fas fa-home"></i> <span>Início</span></button>
        <button class="menu-btn" onclick="navegar('areceber', this)"><i class="fas fa-hand-holding-usd"></i> <span>A Receber</span></button>
        <button class="menu-btn" onclick="navegar('vendas', this)"><i class="fas fa-shopping-bag"></i> <span>Venda</span></button>
        <button class="menu-btn" onclick="navegar('clientes', this)"><i class="fas fa-user-friends"></i> <span>Clientes</span></button>
        <button class="menu-btn" onclick="navegar('produtos', this)"><i class="fas fa-boxes"></i> <span>Estoque</span></button>
        <button class="menu-btn" onclick="navegar('perfil', this)"><i class="fas fa-store"></i> <span>Perfil</span></button>
      </nav>
    
      <main class="main-content">
        
        <div id="dashboard" class="page active">
          <h2>Visão Geral</h2>
          <div class="grid-3">
            <div class="card dash-card card-success">
                <i class="fas fa-check-circle dash-bg-icon"></i>
                <label>Recebido</label>
                <div class="dash-value" id="dashReceita">R$ 0,00</div>
            </div>
            <div class="card dash-card card-warning">
                <i class="fas fa-clock dash-bg-icon"></i>
                <label>A Receber</label>
                <div class="dash-value" id="dashPendente">R$ 0,00</div>
            </div>
            <div class="card dash-card card-primary">
                <i class="fas fa-chart-line dash-bg-icon"></i>
                <label>Total Vendas</label>
                <div class="dash-value" id="dashTotal">R$ 0,00</div>
            </div>
          </div>
          
          <div class="card">
            <h3>📜 Últimas Vendas</h3>
            <div class="table-responsive"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Valor</th><th>Ações</th></tr></thead><tbody id="tbHistorico"></tbody></table></div>
          </div>
        </div>
    
        <div id="areceber" class="page">
          <h2>Contas a Receber</h2>
          <div id="listaRecebimentos"></div>
        </div>
    
        <div id="vendas" class="page">
          <h2>Nova Venda</h2>
          <div class="grid-2">
            <div class="card">
              <label>Produto</label>
              <div class="grid-2" style="gap:15px; margin-bottom:0;"><select id="selProduto"></select><input type="number" id="qtdItem" value="1"></div>
              <button class="btn-primary" onclick="addCarrinho()" style="margin-top:20px; background: #f59e0b;">Adicionar</button>
            </div>
            <div class="card">
              <h3>Carrinho</h3>
              <div class="table-responsive"><table><thead><tr><th>Item</th><th>Qtd</th><th>Sub</th></tr></thead><tbody id="tbCarrinho"></tbody></table></div>
              <h3 id="totalCarrinho" style="text-align:right; color:#6366f1;">Total: R$ 0,00</h3>
            </div>
          </div>
          <div class="card" id="cardFinalizar" style="display:none;">
            <div class="grid-2">
              <div><label>Cliente</label><select id="selCliente"></select></div>
              <div><label>Tipo</label><select id="tipoPagamento" onchange="toggleCrediario()"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option><option value="crediario">Crediário</option></select></div>
            </div>
            <div id="areaCrediario" style="display:none; padding:15px; background:rgba(0,0,0,0.05); border-radius:10px; margin-bottom:15px;">
               <div class="grid-2"><div><label>Parcelas</label><select id="qtdParcelas"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select></div><div><label>Vencimento</label><input type="date" id="dataPrimeira"></div></div>
            </div>
            <button class="btn-primary" onclick="finalizarVenda()">FINALIZAR VENDA</button>
          </div>
        </div>
    
        <div id="perfil" class="page">
          <h2>Perfil da Empresa</h2>
          <div class="card">
            <label>Nome da Loja</label><input id="empNome" placeholder="RE Solution Store">
            <div class="grid-2">
              <div><label>CNPJ / CPF</label><input id="empDoc" placeholder="00.000.000/0001-00"></div>
              <div><label>Telefone</label><input id="empTel" placeholder="(00) 00000-0000"></div>
            </div>
            <label>Endereço</label><input id="empEnd" placeholder="Rua, Número, Bairro, Cidade">
            <button class="btn-primary" onclick="salvarEmpresa()">SALVAR DADOS</button>
          </div>
        </div>
    
        <div id="clientes" class="page">
          <h2>Clientes</h2>
          <div class="card"><div class="grid-2"><div><label>Nome</label><input id="nomeCli"></div><div><label>WhatsApp</label><input id="telCli"></div></div><button class="btn-primary" onclick="addCliente()">Salvar</button></div>
          <div class="card table-responsive"><table><thead><tr><th>Nome</th><th>Tel</th><th>Ação</th></tr></thead><tbody id="tbClientes"></tbody></table></div>
        </div>
    
        <div id="produtos" class="page">
          <h2>Estoque</h2>
          <div class="card"><div class="grid-3"><div><label>Produto</label><input id="nomeProd"></div><div><label>R$</label><input id="precoProd" type="number"></div><div><label>Qtd</label><input id="qtdProd" type="number"></div></div><button class="btn-primary" onclick="addProduto()">Salvar</button></div>
          <div class="card table-responsive"><table><thead><tr><th>Produto</th><th>Preço</th><th>Qtd</th><th>Ação</th></tr></thead><tbody id="tbProdutos"></tbody></table></div>
        </div>
      </main>
    
      <div id="modalCupom" class="modal-overlay">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <div id="areaCupom" class="cupom-box">
            <div class="cupom-header">
              <div id="printEmpNome" style="font-size:16px; font-weight:bold;"></div>
              <div id="printEmpDoc" style="font-size:10px;"></div>
              <div id="printEmpEnd" style="font-size:10px;"></div>
              <div id="printEmpTel" style="font-size:10px;"></div>
              <div style="margin-top:8px; border-top:1px dashed #000; padding-top:5px;">COMPROVANTE</div>
              <div id="cupomId" style="font-family:monospace"></div>
              <div id="cupomData" style="font-size:10px;"></div>
            </div>
            <div style="margin-bottom:5px;">CLIENTE: <span id="cupomCliente" style="font-weight:bold"></span></div>
            <div id="cupomLista"></div>
            <div class="cupom-total"><span>TOTAL:</span><span id="cupomTotal"></span></div>
            <div id="cupomParcelas" style="font-size:10px; margin-top:5px; display:none;"></div>
          </div>
          <div class="no-print" style="margin-top:15px; display:flex; flex-direction:column; gap:8px; width:300px;">
            <button class="btn-primary" onclick="window.print()">IMPRIMIR</button>
            <button class="btn-primary" style="background:#ef4444;" onclick="fecharCupom()">FECHAR</button>
          </div>
        </div>
      </div>
    
    <script>
    const db = { get: k => JSON.parse(localStorage.getItem(k))||[], set: (k,v) => localStorage.setItem(k, JSON.stringify(v)) };
    let clientes = db.get("clientes"), produtos = db.get("produtos"), vendas = db.get("vendas"), empresa = db.get("empresa") || {}, carrinho = [];
    
    window.onload = () => { 
      if(document.getElementById('dataPrimeira')) document.getElementById('dataPrimeira').valueAsDate = new Date(); 
      if(localStorage.getItem('theme') === 'dark') toggleTheme(true);
      carregarEmpresa(); atualizarTudo(); 
    };
    
    function toggleTheme(init = false) {
      const body = document.body;
      const btn = document.getElementById('themeBtn');
      if(!init) {
        body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', body.dataset.theme);
      } else {
        body.dataset.theme = 'dark';
      }
      btn.className = body.dataset.theme === 'dark' ? 'fas fa-sun dark-toggle' : 'fas fa-moon dark-toggle';
    }
    
    function formatMoney(n) { return parseFloat(n).toLocaleString('pt-BR',{style:'currency', currency:'BRL'}); }
    function navegar(id, btn) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); if(id === 'areceber') renderAReceber(); }
    
    function salvarEmpresa() { empresa = { nome: document.getElementById("empNome").value, doc: document.getElementById("empDoc").value, tel: document.getElementById("empTel").value, end: document.getElementById("empEnd").value }; db.set("empresa", empresa); alert("Dados Salvos!"); }
    function carregarEmpresa() { document.getElementById("empNome").value = empresa.nome || ""; document.getElementById("empDoc").value = empresa.doc || ""; document.getElementById("empTel").value = empresa.tel || ""; document.getElementById("empEnd").value = empresa.end || ""; }
    
    function addCarrinho() { const i=document.getElementById("selProduto").value, q=parseInt(document.getElementById("qtdItem").value); if(!i||q<1) return; const p=produtos[i]; carrinho.push({idOrigem:i, nome:p.nome, preco:p.preco, qtd:q, sub:p.preco*q}); renderCarrinho(); }
    function renderCarrinho() { const tb=document.getElementById("tbCarrinho"); tb.innerHTML=""; let t=0; carrinho.forEach(c=>{t+=c.sub; tb.innerHTML+=`<tr><td>${c.nome}</td><td>${c.qtd}</td><td>${formatMoney(c.sub)}</td></tr>`}); document.getElementById("totalCarrinho").innerText="Total: "+formatMoney(t); document.getElementById("cardFinalizar").style.display=t>0?'block':'none'; }
    function toggleCrediario() { document.getElementById("areaCrediario").style.display=document.getElementById("tipoPagamento").value==='crediario'?'block':'none'; }
    
    function finalizarVenda() {
      const cliIdx=document.getElementById("selCliente").value; if(!cliIdx) return alert("Cliente?");
      const t=carrinho.reduce((a,b)=>a+b.sub,0), tipo=document.getElementById("tipoPagamento").value;
      let par=[]; if(tipo==='crediario') {
        const q=parseInt(document.getElementById("qtdParcelas").value), dt=document.getElementById("dataPrimeira").value;
        let d_base=new Date(dt+'T12:00:00'); for(let i=0;i<q;i++) { let d=new Date(d_base); d.setMonth(d.getMonth()+i); par.push({num:i+1, data:d.toLocaleDateString('pt-BR'), valor:t/q, paga:false}); }
      }
      carrinho.forEach(x=>produtos[x.idOrigem].qtd-=x.qtd); db.set("produtos",produtos);
      const v = {id:Date.now(), idVisivel: '#'+Date.now().toString().slice(-4), cliente:clientes[cliIdx].nome, total:t, tipo, parcelas:par, itens:[...carrinho], dataVenda:new Date().toLocaleString('pt-BR')};
      vendas.unshift(v); db.set("vendas",vendas); gerarCupom(v); carrinho=[]; renderCarrinho(); atualizarTudo();
    }
    
    function gerarCupom(v) {
      document.getElementById("printEmpNome").innerText = empresa.nome || "RE SOLUTION";
      document.getElementById("printEmpDoc").innerText = empresa.doc || "";
      document.getElementById("printEmpEnd").innerText = empresa.end || "";
      document.getElementById("printEmpTel").innerText = empresa.tel || "";
      document.getElementById("cupomId").innerText = "PEDIDO " + v.idVisivel; document.getElementById("cupomData").innerText = v.dataVenda;
      document.getElementById("cupomCliente").innerText = v.cliente; document.getElementById("cupomTotal").innerText = formatMoney(v.total);
      const l = document.getElementById("cupomLista"); l.innerHTML = "";
      v.itens.forEach(i => { l.innerHTML += `<div class="cupom-item"><div class="c-info"><span class="c-nome">${i.nome}</span><span>${i.qtd} x ${formatMoney(i.preco)}</span></div><div class="c-valor"><b>${formatMoney(i.sub)}</b></div></div>`; });
      const dp = document.getElementById("cupomParcelas");
      if(v.tipo === 'crediario') { dp.style.display='block'; dp.innerHTML="<b>Parcelas:</b><br>"; v.parcelas.forEach(p => dp.innerHTML += `${p.num}x ${p.data} - ${formatMoney(p.valor)}<br>`); } else dp.style.display='none';
      document.getElementById("modalCupom").style.display = "flex";
    }
    
    function renderAReceber() {
      const container = document.getElementById("listaRecebimentos"); container.innerHTML = "";
      vendas.forEach((v, vI) => { if(v.tipo === 'crediario') {
        const pends = v.parcelas.map((p, pI) => ({...p, pI})).filter(p => !p.paga);
        if(pends.length > 0) {
          let h = ""; pends.forEach(p => h += `<div class="receber-item"><div>${p.num}ª Parc - ${p.data}<br><b>${formatMoney(p.valor)}</b></div><button class="receber-btn" onclick="baixarParc(${vI}, ${p.pI})">PAGO</button></div>`);
          const c = document.createElement('div'); c.className = "receber-card";
          c.innerHTML = `<div class="receber-header"><b>${v.cliente}</b><span>${v.idVisivel}</span></div>${h}`;
          container.appendChild(c);
        }
      }});
    }
    
    function baixarParc(vI, pI) { if(confirm("Confirmar?")) { vendas[vI].parcelas[pI].paga = true; db.set("vendas", vendas); renderAReceber(); atualizarDashboard(); } }
    function fecharCupom() { document.getElementById("modalCupom").style.display = "none"; navegar('dashboard', document.querySelector('.menu-btn')); }
    function addCliente() { const n=document.getElementById("nomeCli").value, t=document.getElementById("telCli").value; if(n){clientes.push({nome:n, tel:t}); db.set("clientes",clientes); atualizarTudo(); alert("Salvo");} }
    function addProduto() { const n=document.getElementById("nomeProd").value, p=document.getElementById("precoProd").value, q=document.getElementById("qtdProd").value; if(n){produtos.push({nome:n, preco:p, qtd:q}); db.set("produtos",produtos); atualizarTudo(); alert("Salvo");} }
    function deletar(t,i) { if(confirm("Apagar?")){ if(t==='c') clientes.splice(i,1); else produtos.splice(i,1); db.set("clientes",clientes); db.set("produtos",produtos); atualizarTudo();} }
    function deletarVenda(i) { if(confirm("Excluir?")){ vendas.splice(i,1); db.set("vendas",vendas); atualizarTudo(); } }
    
    function animarValor(element, endValue) {
      const startValue = 0;
      const duration = 1000;
      const startTime = performance.now();
    
      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing function (easeOutQuad) para suavizar
        const ease = 1 - Math.pow(1 - progress, 3);
        
        const current = startValue + (endValue - startValue) * ease;
        element.innerText = formatMoney(current);
    
        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          element.innerText = formatMoney(endValue); // Garante valor final exato
        }
      }
      requestAnimationFrame(update);
    }
    
    function atualizarDashboard() { 
      let c=0, p=0, t=0; vendas.forEach(v=>{ t+=v.total; if(v.tipo!=='crediario') c+=v.total; else v.parcelas.forEach(px=>{if(px.paga) c+=px.valor; else p+=px.valor}) }); 
      
      // Chama a animação em vez de setar o texto direto
      animarValor(document.getElementById("dashReceita"), c);
      animarValor(document.getElementById("dashPendente"), p);
      animarValor(document.getElementById("dashTotal"), t);
    
      const th = document.getElementById("tbHistorico"); th.innerHTML="";
      vendas.slice(0, 10).forEach((v, i) => { th.innerHTML += `<tr><td style="text-align:center;font-weight:bold">${v.idVisivel}</td><td>${v.cliente}</td><td style="text-align:center">${formatMoney(v.total)}</td><td style="text-align:center"><div class="btn-group-action"><button class="btn-icon btn-print-mini" onclick="gerarCupom(vendas[${i}])"><i class="fas fa-print"></i></button><button class="btn-icon btn-trash-mini" onclick="deletarVenda(${i})"><i class="fas fa-trash"></i></button></div></td></tr>`; });
    }
    
    function atualizarTudo() { 
      atualizarDashboard(); 
      const sc=document.getElementById("selCliente"); sc.innerHTML="<option value=''>Cliente...</option>"; clientes.forEach((c,i)=>sc.innerHTML+=`<option value="${i}">${c.nome}</option>`); 
      const sp=document.getElementById("selProduto"); sp.innerHTML="<option value=''>Produto...</option>"; produtos.forEach((p,i)=>sp.innerHTML+=`<option value="${i}">${p.nome}</option>`); 
      const tc=document.getElementById("tbClientes"); tc.innerHTML=""; clientes.forEach((c,i)=>tc.innerHTML+=`<tr><td>${c.nome}</td><td style="text-align:center">${c.tel}</td><td style="text-align:center"><button onclick="deletar('c',${i})">X</button></td></tr>`); 
      const tp=document.getElementById("tbProdutos"); tp.innerHTML=""; produtos.forEach((p,i)=>tp.innerHTML+=`<tr><td>${p.nome}</td><td style="text-align:center">${formatMoney(p.preco)}</td><td style="text-align:center">${p.qtd}</td><td style="text-align:center"><button onclick="deletar('p',${i})">X</button></td></tr>`); 
    }
    </script>
    </body>
