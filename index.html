<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RE Solution - Sistema Integrado</title>

<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --sidebar-bg: #1e293b;
    --primary: #3b82f6;
    --bg-color: #f1f5f9;
    --text-color: #334155;
    --card-bg: #ffffff;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Inter', sans-serif; 
    margin: 0; 
    display: flex; 
    height: 100vh; 
    background-color: var(--bg-color); 
    color: var(--text-color); 
    overflow: hidden; 
  }

  /* =========================================
     SIDEBAR DESKTOP (CORRIGIDO)
     ========================================= */
  .sidebar { 
    width: 260px; 
    background-color: var(--sidebar-bg); 
    color: white; 
    display: flex; 
    flex-direction: column; /* Garante lista vertical */
    padding: 20px; 
    flex-shrink: 0; 
    z-index: 100;
  }
  
  .logo { 
    font-size: 1.4rem; 
    font-weight: 700; 
    margin-bottom: 40px; 
    color: var(--primary); 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    padding-left: 10px; 
  }
  .logo span { color: white; }
  
  /* Botões do Menu Desktop */
  .menu-btn { 
    background: transparent; 
    border: none; 
    color: #94a3b8; 
    padding: 12px 15px; 
    
    /* ALINHAMENTO IMPORTANTE */
    display: flex; 
    flex-direction: row; /* Ícone ao lado do texto */
    align-items: center; /* Centraliza verticalmente */
    justify-content: flex-start; /* Alinha tudo à esquerda */
    gap: 15px; /* Espaço entre ícone e texto */
    text-align: left;
    
    cursor: pointer; 
    font-size: 0.95rem; 
    border-radius: 8px; 
    margin-bottom: 5px; 
    width: 100%; 
    transition: background 0.2s, color 0.2s; 
  }
  
  .menu-btn:hover { background-color: #334155; color: white; }
  .menu-btn.active { background-color: var(--primary); color: white; font-weight: 600; }
  
  /* Largura fixa para ícones garante alinhamento do texto */
  .menu-btn i { width: 25px; text-align: center; font-size: 1.1rem; }
  .menu-btn span { display: block; } /* Garante que o texto apareça */

  /* --- CONTEÚDO PRINCIPAL --- */
  .main-content { flex: 1; padding: 30px; overflow-y: auto; overflow-x: hidden; position: relative; }
  .page { display: none; animation: fadeIn 0.3s ease-in-out; padding-bottom: 80px; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--sidebar-bg); margin-top: 0; font-size: 1.5rem; }

  /* --- CARDS & GRID --- */
  .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  
  label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #475569; }
  input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: #fff; margin-bottom: 15px; outline: none; }
  button { padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; transition: 0.2s; }
  .btn-primary { background-color: var(--primary); color: white; width: 100%; }
  .btn-success { background-color: var(--success); color: white; padding: 6px 12px; font-size: 0.85rem; width: auto; }
  .btn-add { background-color: var(--warning); color: white; width: 100%; }
  .btn-danger { background-color: var(--danger); color: white; padding: 6px 12px; font-size: 0.85rem; width: auto; }

  /* --- CALENDÁRIO --- */
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day-name { text-align: center; font-weight: bold; color: #64748b; padding: 10px; background: #f8fafc; border-radius: 8px; }
  .day-cell { background: white; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 120px; padding: 10px; position: relative; cursor: pointer; transition: 0.2s; }
  .day-cell:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .day-number { font-weight: 700; color: #334155; margin-bottom: 5px; display: block; font-size: 1.1rem; }
  .today { border: 2px solid var(--primary); background: #eff6ff; }
  .day-summary { font-size: 0.75rem; color: #64748b; margin-top: 5px; }
  .event-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot-pago { background-color: var(--success); }
  .dot-pendente { background-color: var(--warning); }

  /* --- TABELA --- */
  .table-responsive { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; min-width: 600px; }
  th { background: #f8fafc; color: #475569; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid #e2e8f0; color: #334155; }

  /* --- MODAL --- */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; justify-content: center; align-items: center; }
  .modal-overlay.open { display: flex; }
  .modal-card { background: white; width: 95%; max-width: 600px; border-radius: 12px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 0; overflow-y: auto; }
  .lista-recebimentos { width: 100%; min-width: auto; }
  .row-pago { background-color: #f0fdf4; }

  /* =========================================
     ESTILO MOBILE (SOBRESCREVE DESKTOP)
     ========================================= */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    
    .sidebar {
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 70px; 
      flex-direction: row; /* Muda para linha horizontal */
      justify-content: space-between; 
      padding: 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.1); 
      border-top: 1px solid #334155;
      z-index: 9999; 
      background: #1e293b;
    }
    
    .logo { display: none; }
    
    /* Botões Mobile */
    .menu-btn {
      flex: 1; /* Ocupa espaço igual na barra */
      flex-direction: column; /* Ícone em cima, texto embaixo */
      justify-content: center; 
      align-items: center;
      gap: 4px; 
      padding: 5px; 
      margin: 0; 
      border-radius: 0; 
      font-size: 0.7rem; 
      height: 100%;
      color: #94a3b8;
      text-align: center;
    }
    
    .menu-btn i { font-size: 1.4rem; margin-bottom: 2px; display: block; width: auto; }
    .menu-btn span { display: block; }
    
    .menu-btn.active { 
      border-top: 4px solid var(--primary); 
      background: rgba(255,255,255,0.05); 
      color: var(--primary); 
    }

    .main-content { padding: 15px; padding-bottom: 90px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 15px; }
    .calendar-grid { grid-template-columns: 1fr; gap: 8px; }
    .day-name { display: none; }
    .day-cell { min-height: auto; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .modal-card { width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
    .modal-body { padding-bottom: 100px; }
  }
</style>
</head>
<body>

  <nav class="sidebar">
    <div class="logo"><i class="fas fa-wallet fa-lg"></i> <span>RE Solution</span></div>
    
    <button class="menu-btn active" onclick="navegar('dashboard', this)">
      <i class="fas fa-chart-pie"></i> <span>Dash</span>
    </button>
    <button class="menu-btn" onclick="navegar('calendario', this)">
      <i class="fas fa-calendar-check"></i> <span>Agenda</span>
    </button>
    <button class="menu-btn" onclick="navegar('vendas', this)">
      <i class="fas fa-shopping-cart"></i> <span>Venda</span>
    </button>
    <button class="menu-btn" onclick="navegar('clientes', this)">
      <i class="fas fa-users"></i> <span>Clientes</span>
    </button>
    <button class="menu-btn" onclick="navegar('produtos', this)">
      <i class="fas fa-box"></i> <span>Estoque</span>
    </button>
  </nav>

  <main class="main-content">
    
    <div id="dashboard" class="page active">
      <h2>Visão Geral</h2>
      <div class="grid-3">
        <div class="card" style="border-left:5px solid var(--success)">
          <label>Caixa (Recebido)</label>
          <h1 id="dashReceita" style="margin:5px 0; color:var(--success)">R$ 0,00</h1>
        </div>
        <div class="card" style="border-left:5px solid var(--warning)">
          <label>A Receber</label>
          <h1 id="dashPendente" style="margin:5px 0; color:var(--warning)">R$ 0,00</h1>
        </div>
        <div class="card" style="border-left:5px solid var(--primary)">
          <label>Vendas Totais</label>
          <h1 id="dashTotal" style="margin:5px 0; color:var(--primary)">R$ 0,00</h1>
        </div>
      </div>
    </div>

    <div id="calendario" class="page">
      <div class="calendar-header">
        <h2 style="border:none; margin:0;">Agenda</h2>
        <div>
          <button class="btn-primary" style="width:auto; padding:8px 15px;" onclick="mudarMes(-1)"><i class="fas fa-chevron-left"></i></button>
          <span id="mesAnoLabel" style="font-size:1.1rem; font-weight:bold; margin:0 15px;">MÊS</span>
          <button class="btn-primary" style="width:auto; padding:8px 15px;" onclick="mudarMes(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="calendar-grid" id="gridDias"></div>
    </div>

    <div id="vendas" class="page">
      <h2>Nova Venda</h2>
      <div class="grid-2">
        <div class="card">
          <label>Adicionar Produto</label>
          <div class="grid-2" style="gap:10px; margin-bottom:0;">
            <select id="selProduto" style="margin-bottom:0;"><option>Carregando...</option></select>
            <input type="number" id="qtdItem" value="1" min="1" style="margin-bottom:0;">
          </div>
          <button class="btn-add" onclick="addCarrinho()" style="margin-top:15px;">+ Adicionar</button>
        </div>
        <div class="card">
          <h3 style="margin-top:0;">Carrinho</h3>
          <div class="table-responsive">
            <table style="min-width:100%;">
              <thead><tr><th>Item</th><th>Qtd</th><th>Subtotal</th></tr></thead>
              <tbody id="tbCarrinho"></tbody>
            </table>
          </div>
          <div style="text-align:right; font-size:1.3rem; font-weight:bold; margin-top:15px; color:var(--primary);">
            Total: <span id="totalCarrinho">R$ 0,00</span>
          </div>
        </div>
      </div>

      <div class="card" id="cardFinalizar" style="display:none; border:2px solid var(--primary);">
        <h3 style="margin-top:0;">Finalizar</h3>
        <div class="grid-2">
          <div><label>Cliente</label><select id="selCliente"><option>Selecione...</option></select></div>
          <div>
            <label>Pagamento</label>
            <select id="tipoPagamento" onchange="toggleCrediario()">
              <option value="dinheiro">💵 Dinheiro</option>
              <option value="pix">💠 Pix</option>
              <option value="debito">💳 Débito</option>
              <option value="crediario">📅 Crediário</option>
            </select>
          </div>
        </div>
        <div id="areaCrediario" style="display:none; background:#f0f9ff; padding:15px; border:1px dashed var(--primary); margin-bottom:15px; border-radius:8px;">
          <h4 style="margin:0 0 10px 0;">Parcelas</h4>
          <div class="grid-2">
            <div><label>Qtd</label><select id="qtdParcelas"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option><option value="6">6x</option></select></div>
            <div><label>Venc. 1ª Parcela</label><input type="date" id="dataPrimeira"></div>
          </div>
        </div>
        <button class="btn-primary" onclick="finalizarVenda()" style="font-size:1.1rem; padding:16px;">
          <i class="fas fa-check-circle"></i> CONFIRMAR
        </button>
      </div>
    </div>

    <div id="clientes" class="page">
      <h2>Clientes</h2>
      <div class="card">
        <div class="grid-2">
          <div><label>Nome</label><input id="nomeCli" placeholder="Nome Completo"></div>
          <div><label>WhatsApp</label><input id="telCli" placeholder="(00) 00000-0000"></div>
        </div>
        <div class="grid-2">
          <div><label>Email</label><input id="emailCli" placeholder="email@cliente.com"></div>
          <div><label>Endereço</label><input id="endCli" placeholder="Rua, Bairro, Nº"></div>
        </div>
        <button class="btn-primary" onclick="addCliente()">Salvar</button>
      </div>
      <div class="card table-responsive">
        <table>
          <thead><tr><th>Nome</th><th>Contato</th><th>Ação</th></tr></thead>
          <tbody id="tbClientes"></tbody>
        </table>
      </div>
    </div>

    <div id="produtos" class="page">
      <h2>Estoque</h2>
      <div class="card">
        <div class="grid-3">
          <div><label>Produto</label><input id="nomeProd" placeholder="Nome"></div>
          <div><label>Preço</label><input id="precoProd" type="number" step="0.01"></div>
          <div><label>Qtd</label><input id="qtdProd" type="number"></div>
        </div>
        <button class="btn-primary" onclick="addProduto()">Salvar</button>
      </div>
      <div class="card table-responsive">
        <table>
          <thead><tr><th>Produto</th><th>Preço</th><th>Qtd</th><th>Ação</th></tr></thead>
          <tbody id="tbProdutos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modalDia" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="tituloModalDia" style="margin:0">Recebimentos</h3>
        <button onclick="document.getElementById('modalDia').style.display='none'" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="lista-recebimentos">
            <thead><tr><th>Cliente</th><th>Valor</th><th>Ação</th></tr></thead>
            <tbody id="listaParcelasDia"></tbody>
          </table>
        </div>
        <div id="msgSemParcelas" style="padding:30px; text-align:center; color:#94a3b8; display:none;">Nada para hoje.</div>
      </div>
    </div>
  </div>

<script>
// --- FUNÇÕES GERAIS ---
function navegar(id, btn) {
  // Troca de página
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById(id);
  if(target) target.classList.add('active');
  
  // Troca de botão ativo
  document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  
  if(id === 'calendario') renderCalendar();
}

const db = { 
  get: k => { try { return JSON.parse(localStorage.getItem(k))||[] } catch(e){ return [] } }, 
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)) 
};

let clientes = db.get("clientes");
let produtos = db.get("produtos");
let vendas = db.get("vendas");
let carrinho = [];
let dataAtual = new Date();

window.onload = () => {
  if(document.getElementById('dataPrimeira')) document.getElementById('dataPrimeira').valueAsDate = new Date();
  atualizarTudo();
  renderCalendar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
};

function formatMoney(n) { return parseFloat(n).toLocaleString('pt-BR',{style:'currency', currency:'BRL'}); }

// --- CALENDÁRIO ---
function mudarMes(delta) {
  dataAtual.setMonth(dataAtual.getMonth() + delta);
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById("gridDias");
  if(!grid) return;
  grid.innerHTML = '<div class="day-name">DOM</div><div class="day-name">SEG</div><div class="day-name">TER</div><div class="day-name">QUA</div><div class="day-name">QUI</div><div class="day-name">SEX</div><div class="day-name">SÁB</div>';
  
  const ano = dataAtual.getFullYear();
  const mes = dataAtual.getMonth();
  document.getElementById("mesAnoLabel").innerText = new Date(ano, mes).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
  
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const primeiroDia = new Date(ano, mes, 1).getDay();

  for(let i=0; i<primeiroDia; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-name';
    grid.appendChild(empty);
  }

  for(let dia=1; dia<=diasNoMes; dia++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dataStr = new Date(ano, mes, dia).toLocaleDateString('pt-BR');
    const hoje = new Date();
    if(dia===hoje.getDate() && mes===hoje.getMonth() && ano===hoje.getFullYear()) cell.classList.add('today');

    let pendente=0, pago=0;
    vendas.forEach(v => {
      if(v.tipo==='crediario' && v.parcelas) {
        v.parcelas.forEach(p => { 
          if(p.data === dataStr) { if(p.paga) pago++; else pendente++; } 
        });
      }
    });

    let html = `<span class="day-number">${dia}</span>`;
    if(pendente>0 || pago>0) {
      html += `<div class="day-summary">`;
      if(pendente>0) html += `<div><span class="event-dot dot-pendente"></span>${pendente} a receber</div>`;
      if(pago>0) html += `<div><span class="event-dot dot-pago"></span>${pago} pagos</div>`;
      html += `</div>`;
    } else {
      html += `<div class="day-summary" style="opacity:0">.</div>`;
    }
    cell.innerHTML = html;
    cell.onclick = () => abrirModalDia(dataStr);
    grid.appendChild(cell);
  }
}

function abrirModalDia(dataStr) {
  document.getElementById("tituloModalDia").innerText = `Dia ${dataStr}`;
  const tbody = document.getElementById("listaParcelasDia");
  tbody.innerHTML = "";
  let achou = false;

  vendas.forEach((v, vIndex) => {
    if(v.tipo === 'crediario' && v.parcelas) {
      v.parcelas.forEach((p, pIndex) => {
        if(p.data === dataStr) {
          achou = true;
          const tr = document.createElement('tr');
          if(p.paga) tr.className = 'row-pago';
          tr.innerHTML = `
            <td><b>${v.cliente}</b><br><small>#${v.id.toString().slice(-4)}</small></td>
            <td style="font-weight:600">${formatMoney(p.valor)}</td>
            <td>${p.paga ? '<i class="fas fa-check" style="color:green"></i>' : `<button class="btn-success" onclick="receber(${vIndex},${pIndex},'${dataStr}')">Receber</button>`}</td>
          `;
          tbody.appendChild(tr);
        }
      });
    }
  });

  document.getElementById("msgSemParcelas").style.display = achou ? 'none' : 'block';
  document.getElementById("modalDia").style.display = "flex";
}

function receber(vi, pi, dataStr) {
  if(confirm("Confirmar recebimento?")) {
    vendas[vi].parcelas[pi].paga = true;
    db.set("vendas", vendas);
    abrirModalDia(dataStr); atualizarTudo(); renderCalendar();
  }
}
function fecharModal(e) { if(e.target.id === 'modalDia') e.target.style.display='none'; }

// --- DASHBOARD ---
function atualizarDashboard() {
  let caixa=0, pend=0, total=0;
  vendas.forEach(v => {
    total += v.total;
    if(v.tipo !== 'crediario') caixa += v.total;
    else v.parcelas.forEach(p => { if(p.paga) caixa += p.valor; else pend += p.valor; });
  });
  document.getElementById("dashReceita").innerText = formatMoney(caixa);
  document.getElementById("dashPendente").innerText = formatMoney(pend);
  document.getElementById("dashTotal").innerText = formatMoney(total);
}

// --- VENDAS ---
function addCarrinho() {
  const i = document.getElementById("selProduto").value;
  const q = parseInt(document.getElementById("qtdItem").value);
  if(!i || isNaN(q) || q<1) return alert("Erro no item");
  const p = produtos[i];
  const qtdNoCarrinho = carrinho.reduce((acc, item) => item.idOrigem == i ? acc + item.qtd : acc, 0);
  if((q + qtdNoCarrinho) > p.qtd) return alert("Sem estoque!");
  carrinho.push({ idOrigem: i, nome: p.nome, preco: p.preco, qtd: q, sub: p.preco*q });
  renderCarrinho();
}

function renderCarrinho() {
  const tb = document.getElementById("tbCarrinho"); tb.innerHTML="";
  let t=0;
  carrinho.forEach(item => { 
    t += item.sub; 
    tb.innerHTML += `<tr><td>${item.nome}</td><td>${item.qtd}</td><td>${formatMoney(item.sub)}</td></tr>`;
  });
  document.getElementById("totalCarrinho").innerText = formatMoney(t);
  document.getElementById("cardFinalizar").style.display = t>0 ? "block" : "none";
}

function toggleCrediario() {
  const t = document.getElementById("tipoPagamento").value;
  document.getElementById("areaCrediario").style.display = t==='crediario'?'block':'none';
}

function finalizarVenda() {
  const cliIdx = document.getElementById("selCliente").value;
  if(!cliIdx) return alert("Selecione cliente");
  const total = carrinho.reduce((a,b)=>a+b.sub,0);
  const tipo = document.getElementById("tipoPagamento").value;
  let parcelas = [];

  if(tipo==='crediario') {
    const qtd = parseInt(document.getElementById("qtdParcelas").value);
    const dt = document.getElementById("dataPrimeira").value;
    if(!dt) return alert("Data?");
    let db = new Date(dt+'T12:00:00');
    for(let i=0; i<qtd; i++) {
      let d = new Date(db); d.setDate(d.getDate()+(i*30));
      parcelas.push({ num:i+1, data:d.toLocaleDateString('pt-BR'), valor:total/qtd, paga:false });
    }
  }

  carrinho.forEach(x => produtos[x.idOrigem].qtd -= x.qtd);
  db.set("produtos", produtos);

  vendas.unshift({
    id: Date.now(),
    cliente: clientes[cliIdx].nome,
    total: total,
    tipo: tipo,
    parcelas: parcelas,
    itens: [...carrinho],
    dataVenda: new Date().toLocaleDateString('pt-BR')
  });
  db.set("vendas", vendas);
  
  carrinho=[]; renderCarrinho(); atualizarTudo(); renderCalendar();
  alert("Venda OK!");
  navegar('calendario');
}

// --- CRUD ---
function addCliente(){ 
  const n=document.getElementById("nomeCli").value; 
  const t=document.getElementById("telCli").value;
  const e=document.getElementById("emailCli").value;
  const end=document.getElementById("endCli").value;
  if(n){ clientes.push({nome:n, tel:t, email:e, end:end}); db.set("clientes",clientes); atualizarTudo(); alert("Salvo"); }
}
function addProduto(){
  const n=document.getElementById("nomeProd").value; 
  const p=document.getElementById("precoProd").value; 
  const q=document.getElementById("qtdProd").value;
  if(n && p){ produtos.push({nome:n, preco:parseFloat(p), qtd:parseInt(q)}); db.set("produtos",produtos); atualizarTudo(); alert("Salvo"); }
}
function deletar(t, i) {
  if(confirm("Excluir?")) {
    if(t==='c') clientes.splice(i,1); if(t==='p') produtos.splice(i,1);
    db.set("clientes",clientes); db.set("produtos",produtos); atualizarTudo();
  }
}

function atualizarTudo() {
  atualizarDashboard();
  const sc=document.getElementById("selCliente"); sc.innerHTML="<option value=''>Cliente...</option>";
  clientes.forEach((c,i)=>sc.innerHTML+=`<option value="${i}">${c.nome}</option>`);
  const sp=document.getElementById("selProduto"); sp.innerHTML="<option value=''>Produto...</option>";
  produtos.forEach((p,i)=>sp.innerHTML+=`<option value="${i}">${p.nome}</option>`);
  
  const tc=document.getElementById("tbClientes"); tc.innerHTML="";
  clientes.forEach((c,i)=>tc.innerHTML+=`<tr><td>${c.nome}</td><td>${c.tel}</td><td><button class="btn-danger" onclick="deletar('c',${i})"><i class="fas fa-trash"></i></button></td></tr>`);
  const tp=document.getElementById("tbProdutos"); tp.innerHTML="";
  produtos.forEach((p,i)=>tp.innerHTML+=`<tr><td>${p.nome}</td><td>${formatMoney(p.preco)}</td><td>${p.qtd}</td><td><button class="btn-danger" onclick="deletar('p',${i})"><i class="fas fa-trash"></i></button></td></tr>`);
}
</script>
