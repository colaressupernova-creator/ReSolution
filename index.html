<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RE Solution - Blush Edition</title>

<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    /* Cores Blush / Aura */
    --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-border: 1px solid rgba(255, 255, 255, 0.6);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    
    --text-dark: #1e293b;
    --text-light: #64748b;
    
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Poppins', sans-serif; 
    margin: 0; 
    display: flex; 
    height: 100vh; 
    color: var(--text-dark); 
    overflow: hidden; 
    
    /* FUNDO ANIMADO */
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 400% 400%;
    animation: blushAnimation 15s ease infinite;
  }

  @keyframes blushAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* --- SIDEBAR DESKTOP (Vertical e Alinhada à Esquerda) --- */
  .sidebar { 
    width: 270px; 
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: var(--glass-border);
    display: flex; 
    flex-direction: column; 
    padding: 25px; 
    flex-shrink: 0; 
    z-index: 100;
  }
  
  .logo { 
    font-size: 1.5rem; 
    font-weight: 700; 
    margin-bottom: 40px; 
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex; 
    align-items: center; 
    gap: 12px; 
    padding-left: 5px; 
  }
  
  .menu-btn { 
    background: transparent; 
    border: none; 
    color: var(--text-light); 
    padding: 14px 18px; 
    
    /* ALINHAMENTO DESKTOP */
    display: flex; 
    align-items: center; 
    justify-content: flex-start; /* Esquerda */
    text-align: left;
    gap: 15px; 
    
    cursor: pointer; 
    font-size: 0.95rem; 
    font-weight: 500;
    border-radius: 12px; 
    margin-bottom: 8px; 
    width: 100%; 
    transition: all 0.3s ease; 
  }
  
  .menu-btn:hover { 
    background: rgba(99, 102, 241, 0.1); 
    color: #6366f1; 
    transform: translateX(5px);
  }
  
  .menu-btn.active { 
    background: var(--primary-gradient); 
    color: white; 
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  
  .menu-btn i { width: 24px; text-align: center; font-size: 1.1rem; }

  /* --- CONTEÚDO PRINCIPAL --- */
  .main-content { flex: 1; padding: 30px; overflow-y: auto; overflow-x: hidden; position: relative; }
  .page { display: none; animation: fadeIn 0.4s ease-out; padding-bottom: 100px; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  h2 { margin-top: 0; font-size: 1.8rem; font-weight: 700; margin-bottom: 25px; text-shadow: 0 2px 10px rgba(0,0,0,0.05); }

  /* --- CARDS (GLASS) --- */
  .card { 
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px; 
    padding: 25px; 
    box-shadow: var(--glass-shadow); 
    border: var(--glass-border);
    margin-bottom: 25px; 
  }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  
  /* --- INPUTS & BUTTONS --- */
  label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-light); }
  input, select { 
    width: 100%; padding: 14px; border: 2px solid rgba(255,255,255,0.8); border-radius: 12px; font-size: 1rem; 
    background: rgba(255,255,255,0.6); color: var(--text-dark); margin-bottom: 15px; outline: none; transition: 0.3s;
    font-family: 'Poppins', sans-serif;
  }
  input:focus, select:focus { background: white; border-color: #a855f7; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1); }
  
  button { padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; transition: 0.3s; font-family: 'Poppins', sans-serif; }
  button:active { transform: scale(0.96); }
  
  .btn-primary { background: var(--primary-gradient); color: white; width: 100%; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
  .btn-success { background: var(--success); color: white; padding: 8px 16px; font-size: 0.85rem; width: auto; border-radius: 8px; }
  .btn-add { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; width: 100%; }
  .btn-danger { background: #ef4444; color: white; padding: 8px 12px; font-size: 0.85rem; width: auto; border-radius: 8px; }

  /* --- CALENDÁRIO --- */
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day-name { text-align: center; font-weight: 700; color: #8b5cf6; padding: 10px; font-size: 0.9rem; }
  .day-cell { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; min-height: 120px; padding: 10px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
  .day-cell:hover { background: white; transform: translateY(-3px); }
  .day-number { font-weight: 700; margin-bottom: 5px; font-size: 1.1rem; }
  .today { border: 2px solid #ec4899; background: rgba(236, 72, 153, 0.05); }
  .day-summary { font-size: 0.75rem; margin-top: auto; }
  .event-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .dot-pago { background-color: var(--success); }
  .dot-pendente { background-color: var(--warning); }

  /* --- TABELA --- */
  .table-responsive { overflow-x: auto; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { background: rgba(99, 102, 241, 0.1); color: #6366f1; padding: 15px; text-align: left; font-weight: 600; }
  td { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }

  /* --- MODAL --- */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; }
  .modal-overlay.open { display: flex; }
  .modal-card { background: #fff; width: 90%; max-width: 500px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); display: flex; flex-direction: column; max-height: 85vh; }
  .modal-header { background: var(--primary-gradient); color: white; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 0; overflow-y: auto; }
  
  .dash-value { font-size: 2rem; font-weight: 700; background: linear-gradient(to right, #333, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* =========================================
     MOBILE (BARRA INFERIOR CORRIGIDA)
     ========================================= */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    
    .sidebar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
      flex-direction: row; justify-content: space-between; padding: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-right: none; border-top: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.05); border-radius: 20px 20px 0 0;
      z-index: 9999;
    }
    
    .logo { display: none; }
    
    .menu-btn {
      flex: 1; /* FORÇA LARGURA IGUAL PARA TODOS */
      flex-direction: column; /* Ícone em cima */
      justify-content: center; 
      align-items: center;
      text-align: center;
      gap: 5px; 
      padding: 5px 0; 
      margin: 0; 
      border-radius: 0; 
      font-size: 0.75rem; 
      height: 100%;
      background: transparent !important;
      color: #94a3b8;
      box-shadow: none !important;
      transform: none !important;
    }
    
    .menu-btn i { font-size: 1.5rem; display: block; width: auto; margin: 0 auto; transition: 0.3s; }
    .menu-btn span { display: block; font-weight: 500; }
    
    .menu-btn.active { color: #8b5cf6; }
    .menu-btn.active i { transform: translateY(-3px); color: #8b5cf6; filter: drop-shadow(0 4px 6px rgba(139, 92, 246, 0.4)); }

    .main-content { padding: 20px; padding-bottom: 100px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 20px; }
    
    .calendar-grid { grid-template-columns: 1fr; gap: 10px; }
    .day-name { display: none; }
    .day-cell { min-height: auto; padding: 20px; flex-direction: row; justify-content: space-between; align-items: center; border-radius: 16px; }
    .day-number { margin: 0; background: rgba(255,255,255,0.8); padding: 10px 15px; border-radius: 12px; }
    
    .modal-card { width: 100%; height: 100%; max-height: 100%; border-radius: 0; background: #fafafa; }
    .modal-body { padding-bottom: 100px; }
  }
</style>
</head>
<body>

  <nav class="sidebar">
    <div class="logo"><i class="fas fa-gem"></i> <span>RE Solution</span></div>
    
    <button class="menu-btn active" onclick="navegar('dashboard', this)">
      <i class="fas fa-home"></i> <span>Início</span>
    </button>
    <button class="menu-btn" onclick="navegar('calendario', this)">
      <i class="fas fa-calendar-alt"></i> <span>Agenda</span>
    </button>
    <button class="menu-btn" onclick="navegar('vendas', this)">
      <i class="fas fa-shopping-bag"></i> <span>Venda</span>
    </button>
    <button class="menu-btn" onclick="navegar('clientes', this)">
      <i class="fas fa-user-friends"></i> <span>Clientes</span>
    </button>
    <button class="menu-btn" onclick="navegar('produtos', this)">
      <i class="fas fa-boxes"></i> <span>Estoque</span>
    </button>
  </nav>

  <main class="main-content">
    
    <div id="dashboard" class="page active">
      <h2>Olá, bem-vindo! ✨</h2>
      <div class="grid-3">
        <div class="card" style="border-left: 4px solid var(--success);">
          <label>Recebido (Caixa)</label>
          <div class="dash-value" id="dashReceita" style="color:var(--success)">R$ 0,00</div>
        </div>
        <div class="card" style="border-left: 4px solid var(--warning);">
          <label>A Receber</label>
          <div class="dash-value" id="dashPendente" style="color:var(--warning)">R$ 0,00</div>
        </div>
        <div class="card" style="border-left: 4px solid #6366f1;">
          <label>Vendas Totais</label>
          <div class="dash-value" id="dashTotal" style="color:#6366f1">R$ 0,00</div>
        </div>
      </div>
    </div>

    <div id="calendario" class="page">
      <div class="calendar-header">
        <h2 style="margin:0;">Agenda Financeira</h2>
        <div style="background:white; padding:5px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
          <button class="btn-primary" style="width:40px; height:40px; padding:0; border-radius:8px;" onclick="mudarMes(-1)"><i class="fas fa-chevron-left"></i></button>
          <span id="mesAnoLabel" style="font-weight:700; margin:0 15px; color:#555;">MÊS</span>
          <button class="btn-primary" style="width:40px; height:40px; padding:0; border-radius:8px;" onclick="mudarMes(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="calendar-grid" id="gridDias"></div>
    </div>

    <div id="vendas" class="page">
      <h2>Nova Venda</h2>
      <div class="grid-2">
        <div class="card">
          <label>Adicionar Produto</label>
          <div class="grid-2" style="gap:15px; margin-bottom:0;">
            <select id="selProduto" style="margin-bottom:0;"><option>Carregando...</option></select>
            <input type="number" id="qtdItem" value="1" min="1" style="margin-bottom:0;">
          </div>
          <button class="btn-add" onclick="addCarrinho()" style="margin-top:20px;">
            <i class="fas fa-plus-circle"></i> Adicionar ao Carrinho
          </button>
        </div>
        
        <div class="card">
          <h3 style="margin-top:0; color:#444;">🛒 Carrinho</h3>
          <div class="table-responsive">
            <table style="min-width:100%;">
              <thead><tr><th>Item</th><th>Qtd</th><th>Subtotal</th></tr></thead>
              <tbody id="tbCarrinho"></tbody>
            </table>
          </div>
          <div style="text-align:right; font-size:1.5rem; font-weight:700; margin-top:20px; color:#6366f1;">
            Total: <span id="totalCarrinho">R$ 0,00</span>
          </div>
        </div>
      </div>

      <div class="card" id="cardFinalizar" style="display:none; border:2px solid #6366f1;">
        <h3 style="margin-top:0; color:#6366f1;">Finalizar Venda</h3>
        <div class="grid-2">
          <div><label>Cliente</label><select id="selCliente"><option>Selecione...</option></select></div>
          <div>
            <label>Pagamento</label>
            <select id="tipoPagamento" onchange="toggleCrediario()">
              <option value="dinheiro">💵 Dinheiro</option>
              <option value="pix">💠 Pix</option>
              <option value="debito">💳 Débito</option>
              <option value="crediario">📅 Crediário</option>
            </select>
          </div>
        </div>
        <div id="areaCrediario" style="display:none; background:rgba(99, 102, 241, 0.05); padding:20px; border-radius:12px; margin-bottom:20px;">
          <h4 style="margin:0 0 15px 0; color:#6366f1;">Parcelamento</h4>
          <div class="grid-2">
            <div><label>Qtd Parcelas</label><select id="qtdParcelas"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="5">5x</option><option value="6">6x</option></select></div>
            <div><label>Vencimento 1ª Parcela</label><input type="date" id="dataPrimeira"></div>
          </div>
        </div>
        <button class="btn-primary" onclick="finalizarVenda()" style="font-size:1.1rem; padding:18px;">
          CONFIRMAR VENDA <i class="fas fa-check"></i>
        </button>
      </div>
    </div>

    <div id="clientes" class="page">
      <h2>Clientes</h2>
      <div class="card">
        <div class="grid-2">
          <div><label>Nome Completo</label><input id="nomeCli" placeholder="Ex: Ana Souza"></div>
          <div><label>WhatsApp</label><input id="telCli" placeholder="(00) 00000-0000"></div>
        </div>
        <div class="grid-2">
          <div><label>Email</label><input id="emailCli" placeholder="email@exemplo.com"></div>
          <div><label>Endereço</label><input id="endCli" placeholder="Rua, Bairro..."></div>
        </div>
        <button class="btn-primary" onclick="addCliente()">Salvar Cliente</button>
      </div>
      <div class="card table-responsive">
        <table>
          <thead><tr><th>Nome</th><th>Contato</th><th>Ação</th></tr></thead>
          <tbody id="tbClientes"></tbody>
        </table>
      </div>
    </div>

    <div id="produtos" class="page">
      <h2>Estoque</h2>
      <div class="card">
        <div class="grid-3">
          <div><label>Produto</label><input id="nomeProd" placeholder="Nome do Item"></div>
          <div><label>Preço</label><input id="precoProd" type="number" step="0.01"></div>
          <div><label>Qtd</label><input id="qtdProd" type="number"></div>
        </div>
        <button class="btn-primary" onclick="addProduto()">Salvar Produto</button>
      </div>
      <div class="card table-responsive">
        <table>
          <thead><tr><th>Produto</th><th>Preço</th><th>Qtd</th><th>Ação</th></tr></thead>
          <tbody id="tbProdutos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modalDia" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="tituloModalDia" style="margin:0">Recebimentos</h3>
        <button onclick="document.getElementById('modalDia').style.display='none'" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table style="width:100%; min-width:auto;">
            <thead><tr><th>Cliente</th><th>Valor</th><th>Status</th></tr></thead>
            <tbody id="listaParcelasDia"></tbody>
          </table>
        </div>
        <div id="msgSemParcelas" style="padding:40px; text-align:center; color:#94a3b8; display:none;">
          <i class="fas fa-calendar-check" style="font-size:3rem; margin-bottom:10px; opacity:0.3;"></i><br>
          Nenhum recebimento para hoje.
        </div>
      </div>
    </div>
  </div>

<script>
function navegar(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id === 'calendario') renderCalendar();
}

const db = { get: k => { try { return JSON.parse(localStorage.getItem(k))||[] } catch(e){ return [] } }, set: (k,v) => localStorage.setItem(k, JSON.stringify(v)) };
let clientes = db.get("clientes"); let produtos = db.get("produtos"); let vendas = db.get("vendas"); let carrinho = []; let dataAtual = new Date();

window.onload = () => {
  if(document.getElementById('dataPrimeira')) document.getElementById('dataPrimeira').valueAsDate = new Date();
  atualizarTudo(); renderCalendar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
};

function formatMoney(n) { return parseFloat(n).toLocaleString('pt-BR',{style:'currency', currency:'BRL'}); }

function mudarMes(delta) { dataAtual.setMonth(dataAtual.getMonth() + delta); renderCalendar(); }
function renderCalendar() {
  const grid = document.getElementById("gridDias"); if(!grid) return;
  grid.innerHTML = '<div class="day-name">DOM</div><div class="day-name">SEG</div><div class="day-name">TER</div><div class="day-name">QUA</div><div class="day-name">QUI</div><div class="day-name">SEX</div><div class="day-name">SÁB</div>';
  const ano = dataAtual.getFullYear(); const mes = dataAtual.getMonth();
  document.getElementById("mesAnoLabel").innerText = new Date(ano, mes).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
  const diasNoMes = new Date(ano, mes + 1, 0).getDate(); const primeiroDia = new Date(ano, mes, 1).getDay();
  for(let i=0; i<primeiroDia; i++) { const e = document.createElement('div'); e.className = 'day-name'; e.innerText=""; grid.appendChild(e); }
  for(let dia=1; dia<=diasNoMes; dia++) {
    const cell = document.createElement('div'); cell.className = 'day-cell';
    const dataStr = new Date(ano, mes, dia).toLocaleDateString('pt-BR');
    const hoje = new Date(); if(dia===hoje.getDate() && mes===hoje.getMonth() && ano===hoje.getFullYear()) cell.classList.add('today');
    let pendente=0, pago=0;
    vendas.forEach(v => { if(v.tipo==='crediario' && v.parcelas) v.parcelas.forEach(p => { if(p.data === dataStr) { if(p.paga) pago++; else pendente++; } }); });
    let html = `<span class="day-number">${dia}</span>`;
    if(pendente>0 || pago>0) {
      html += `<div class="day-summary">`;
      if(pendente>0) html += `<div><span class="event-dot dot-pendente"></span>${pendente} a receber</div>`;
      if(pago>0) html += `<div><span class="event-dot dot-pago"></span>${pago} pagos</div>`;
      html += `</div>`;
    } else html += `<div class="day-summary" style="opacity:0">.</div>`;
    cell.innerHTML = html; cell.onclick = () => abrirModalDia(dataStr); grid.appendChild(cell);
  }
}
function abrirModalDia(dataStr) {
  document.getElementById("tituloModalDia").innerText = `Dia ${dataStr}`;
  const tbody = document.getElementById("listaParcelasDia"); tbody.innerHTML = ""; let achou = false;
  vendas.forEach((v, vIndex) => {
    if(v.tipo === 'crediario' && v.parcelas) {
      v.parcelas.forEach((p, pIndex) => {
        if(p.data === dataStr) {
          achou = true;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${v.cliente}</b><br><small style="color:#888">#${v.id.toString().slice(-4)}</small></td>
            <td style="font-weight:600; color:#444;">${formatMoney(p.valor)}</td>
            <td>${p.paga ? '<span class="btn-success" style="background:#dcfce7; color:#166534;">Pago</span>' : `<button class="btn-success" onclick="receber(${vIndex},${pIndex},'${dataStr}')">Receber</button>`}</td>
          `;
          tbody.appendChild(tr);
        }
      });
    }
  });
  document.getElementById("msgSemParcelas").style.display = achou ? 'none' : 'block';
  document.getElementById("modalDia").style.display = "flex";
}
function receber(vi, pi, dataStr) {
  if(confirm("Confirmar recebimento?")) { vendas[vi].parcelas[pi].paga = true; db.set("vendas", vendas); abrirModalDia(dataStr); atualizarTudo(); renderCalendar(); }
}
function fecharModal(e) { if(e.target.id === 'modalDia' || e.target.closest('button')) document.getElementById('modalDia').style.display='none'; }

function atualizarDashboard() {
  let caixa=0, pend=0, total=0;
  vendas.forEach(v => {
    total += v.total;
    if(v.tipo !== 'crediario') caixa += v.total;
    else v.parcelas.forEach(p => { if(p.paga) caixa += p.valor; else pend += p.valor; });
  });
  document.getElementById("dashReceita").innerText = formatMoney(caixa);
  document.getElementById("dashPendente").innerText = formatMoney(pend);
  document.getElementById("dashTotal").innerText = formatMoney(total);
}
function addCarrinho() {
  const i = document.getElementById("selProduto").value; const q = parseInt(document.getElementById("qtdItem").value);
  if(!i || isNaN(q) || q<1) return alert("Erro no item");
  const p = produtos[i]; const qtdNoCarrinho = carrinho.reduce((acc, item) => item.idOrigem == i ? acc + item.qtd : acc, 0);
  if((q + qtdNoCarrinho) > p.qtd) return alert("Sem estoque!");
  carrinho.push({ idOrigem: i, nome: p.nome, preco: p.preco, qtd: q, sub: p.preco*q }); renderCarrinho();
}
function renderCarrinho() {
  const tb = document.getElementById("tbCarrinho"); tb.innerHTML=""; let t=0;
  carrinho.forEach(item => { t += item.sub; tb.innerHTML += `<tr><td>${item.nome}</td><td>${item.qtd}</td><td>${formatMoney(item.sub)}</td></tr>`; });
  document.getElementById("totalCarrinho").innerText = formatMoney(t);
  document.getElementById("cardFinalizar").style.display = t>0 ? "block" : "none";
}
function toggleCrediario() { const t = document.getElementById("tipoPagamento").value; document.getElementById("areaCrediario").style.display = t==='crediario'?'block':'none'; }
function finalizarVenda() {
  const cliIdx = document.getElementById("selCliente").value; if(!cliIdx) return alert("Selecione cliente");
  const total = carrinho.reduce((a,b)=>a+b.sub,0); const tipo = document.getElementById("tipoPagamento").value; let parcelas = [];
  if(tipo==='crediario') {
    const qtd = parseInt(document.getElementById("qtdParcelas").value); const dt = document.getElementById("dataPrimeira").value;
    if(!dt) return alert("Data?"); let db = new Date(dt+'T12:00:00');
    for(let i=0; i<qtd; i++) { let d = new Date(db); d.setDate(d.getDate()+(i*30)); parcelas.push({ num:i+1, data:d.toLocaleDateString('pt-BR'), valor:total/qtd, paga:false }); }
  }
  carrinho.forEach(x => produtos[x.idOrigem].qtd -= x.qtd); db.set("produtos", produtos);
  vendas.unshift({ id: Date.now(), cliente: clientes[cliIdx].nome, total: total, tipo: tipo, parcelas: parcelas, itens: [...carrinho], dataVenda: new Date().toLocaleDateString('pt-BR') });
  db.set("vendas", vendas); carrinho=[]; renderCarrinho(); atualizarTudo(); renderCalendar(); alert("Venda realizada com sucesso!"); navegar('calendario');
}
function addCliente(){ 
  const n=document.getElementById("nomeCli").value; const t=document.getElementById("telCli").value; const e=document.getElementById("emailCli").value; const end=document.getElementById("endCli").value;
  if(n){ clientes.push({nome:n, tel:t, email:e, end:end}); db.set("clientes",clientes); atualizarTudo(); alert("Salvo"); document.getElementById("nomeCli").value=""; }
}
function addProduto(){
  const n=document.getElementById("nomeProd").value; const p=document.getElementById("precoProd").value; const q=document.getElementById("qtdProd").value;
  if(n && p){ produtos.push({nome:n, preco:parseFloat(p), qtd:parseInt(q)}); db.set("produtos",produtos); atualizarTudo(); alert("Salvo"); document.getElementById("nomeProd").value=""; }
}
function deletar(t, i) { if(confirm("Excluir?")) { if(t==='c') clientes.splice(i,1); if(t==='p') produtos.splice(i,1); db.set("clientes",clientes); db.set("produtos",produtos); atualizarTudo(); } }
function atualizarTudo() {
  atualizarDashboard();
  const sc=document.getElementById("selCliente"); sc.innerHTML="<option value=''>Cliente...</option>";
  clientes.forEach((c,i)=>sc.innerHTML+=`<option value="${i}">${c.nome}</option>`);
  const sp=document.getElementById("selProduto"); sp.innerHTML="<option value=''>Produto...</option>";
  produtos.forEach((p,i)=>sp.innerHTML+=`<option value="${i}">${p.nome}</option>`);
  const tc=document.getElementById("tbClientes"); tc.innerHTML="";
  clientes.forEach((c,i)=>tc.innerHTML+=`<tr><td>${c.nome}</td><td>${c.tel}</td><td><button class="btn-danger" onclick="deletar('c',${i})"><i class="fas fa-trash"></i></button></td></tr>`);
  const tp=document.getElementById("tbProdutos"); tp.innerHTML="";
  produtos.forEach((p,i)=>tp.innerHTML+=`<tr><td>${p.nome}</td><td>${formatMoney(p.preco)}</td><td>${p.qtd}</td><td><button class="btn-danger" onclick="deletar('p',${i})"><i class="fas fa-trash"></i></button></td></tr>`);
}
</script>
